services:
  postgres:
    image: postgres:16-alpine
    container_name: kdc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kdc
      POSTGRES_PASSWORD: kdc_secret
      POSTGRES_DB: kashmiri_daal_chawal
    ports:
      - "5432:5432"
    volumes:
      - kdc_pg_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kdc -d kashmiri_daal_chawal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kdc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kdc-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kdc:kdc_secret@postgres:5432/kashmiri_daal_chawal
      API_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kdc-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: kdc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

volumes:
  kdc_pg_data:
