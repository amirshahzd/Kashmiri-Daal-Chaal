name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test -w backend
      - name: Build
        run: npm run build -w backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test -w frontend
      - name: Build
        run: npm run build -w frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Journeys
        run: npx playwright test --project=desktop --project=iphone-13 e2e/journeys.spec.ts

  mobile:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Mobile layout
        run: npx playwright test e2e/mobile-layout.spec.ts --project=phone-360 --project=iphone-13 --project=pixel-7

  performance:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: API budget
        run: npm run test:perf -w backend
      - name: Build web
        run: npm run build -w frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      - name: Mobile Lighthouse
        run: npx --yes @lhci/cli autorun

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, mobile, performance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build and push images
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t "${{ secrets.DOCKER_USERNAME }}/kdc-api:${{ github.sha }}" ./backend
          docker build -t "${{ secrets.DOCKER_USERNAME }}/kdc-web:${{ github.sha }}" ./frontend
          docker push "${{ secrets.DOCKER_USERNAME }}/kdc-api:${{ github.sha }}"
          docker push "${{ secrets.DOCKER_USERNAME }}/kdc-web:${{ github.sha }}"
      - name: Skip deploy until registry secrets exist
        if: ${{ secrets.DOCKER_USERNAME == '' }}
        run: echo "DOCKER_USERNAME is not set, so this green main push is not deployed."
